name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    name: Gerar Deslizae.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e .[dev,build]

      - name: Conferir versão da tag
        shell: bash
        run: |
          version=$(python -c "import deslizae; print(deslizae.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão do pacote ($version)."
            exit 1
          fi

      - name: Rodar testes
        run: python -m pytest -q

      - name: Gerar executável
        run: python -m PyInstaller packaging/deslizae.spec --noconfirm

      - name: Testar executável
        shell: bash
        run: ./dist/Deslizae.exe --version

      - name: Calcular SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum Deslizae.exe > Deslizae.exe.sha256
          cat Deslizae.exe.sha256

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > notas.md
          title="Deslizae ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notas.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notas.md --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/Deslizae.exe dist/Deslizae.exe.sha256 --clobber
