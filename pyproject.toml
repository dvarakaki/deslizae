[project]
name = "deslizae"
version = "0.1.0"
description = "Transforme qualquer celular em touchpad do PC com Windows, direto do navegador."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arakaki" }]
requires-python = ">=3.11"
keywords = ["touchpad", "trackpad", "mouse", "remote", "webrtc", "windows", "pwa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Human Interface Device (HID)",
]
dependencies = [
  "aiohttp>=3.9",
  "qrcode>=7.4",
  "aiortc>=1.9",
]

[project.urls]
Homepage = "https://github.com/dvarakaki/deslizae"
Issues = "https://github.com/dvarakaki/deslizae/issues"
Changelog = "https://github.com/dvarakaki/deslizae/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deslizae = "deslizae.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deslizae"]

[tool.setuptools.package-data]
deslizae = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
